# Builds pyright from the ./pyright submodule into a Debian trixie .deb,
# written to mkosi.output/. Runs unprivileged; see README.md.
# The test/ directory holds a second config that installs that .deb into a
# trixie container.

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=none
OutputDirectory=mkosi.output

[Build]
CacheDirectory=mkosi.cache
BuildDirectory=mkosi.builddir
Incremental=yes
# pnpm fetches the JavaScript build dependencies from the npm registry.
WithNetwork=yes

[Content]
BuildPackages=
        build-essential
        ca-certificates
        debhelper
        dpkg-dev
        nodejs
        npm
