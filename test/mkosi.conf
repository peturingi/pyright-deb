# A trixie container with the .deb from ../mkosi.output installed, for
# trying the package out with `mkosi -C test shell` (or `boot`). Build the
# .deb first; see README.md.

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=directory
ImageId=pyright-test
OutputDirectory=mkosi.output

[Build]
CacheDirectory=mkosi.cache
Incremental=yes
# The .deb is installed by mkosi.postinst.chroot from here. (mkosi's own
# PackageDirectories= proved unreliable: it only indexes the local repository
# when it notices a directory mtime change, which it sometimes misses.)
BuildSources=../mkosi.output:debs
# Lets `mkosi shell`/`mkosi boot` use a directory image without root, via
# systemd-nsresourced and systemd-mountfsd.
ForeignUIDRange=yes

[Content]
Bootable=no
Packages=
        nodejs
        python3
        systemd

[Runtime]
# With registration on, unprivileged systemd-nspawn registers with the
# user's systemd-machined but then aborts because it cannot also register
# with the system one ("Failed to register machine in system context").
Register=no
